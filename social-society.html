<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Society - My Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Mukta', sans-serif; background: #f3f4f6; padding-bottom: 70px; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; color: #94a3b8; font-size: 10px; font-weight: 700; transition: all 0.2s; cursor: pointer; }
        .nav-item.active { color: #db2777; } /* Pink color */
        .nav-item.active svg { stroke: #db2777; transform: scale(1.1); }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .badge-role { font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: 800; text-transform: uppercase; }
        .role-resident { background: #dcfce7; color: #166534; }
        .role-business { background: #fef3c7; color: #92400e; }
        .role-admin { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b border-gray-200 shadow-sm">
        <div class="flex items-center gap-2">
            <a href="index.html" class="text-gray-600 text-2xl font-bold">←</a>
            <h1 class="text-[18px] font-extrabold text-pink-600">My Circle</h1>
        </div>
        <span id="locationBadge" class="bg-pink-50 text-pink-700 text-[10px] font-bold px-3 py-1 rounded-full border border-pink-200 hidden">📍 4km लोकेशन</span>
    </header>

    <!-- Location Loading -->
    <div id="locationAlert" class="bg-amber-100 text-amber-800 p-3 text-center text-xs font-semibold">
        ⏳ तुमचं लोकेशन शोधत आहे... कृपया Allow द्या.
    </div>

    <main class="max-w-lg mx-auto p-4">

        <!-- ================= TAB 1: HOME (FEED) ================= -->
        <div id="view-home" class="view-section active">
            <!-- Filter Chips -->
            <div class="flex gap-2 overflow-x-auto pb-3 mb-2" style="scrollbar-width:none">
                <button onclick="filterFeed('all')" class="filter-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">सर्व</button>
                <button onclick="filterFeed('Ask')" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border">❓ Ask</button>
                <button onclick="filterFeed('Sell')" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border">🛒 Sell</button>
                <button onclick="filterFeed('Alert')" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border">🚨 Alert</button>
                <button onclick="filterFeed('Event')" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border">📅 Event</button>
            </div>
            
            <div id="postsContainer" class="space-y-4">
                <p class="text-center text-gray-500 py-10 text-sm">लोड होत आहे...</p>
            </div>
        </div>

        <!-- ================= TAB 2: DISCOVER ================= -->
        <div id="view-discover" class="view-section">
            <h2 class="font-extrabold text-lg mb-3">Discover</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center" onclick="alert('Groups feature coming soon!')">
                    <span class="text-3xl block mb-2">👥</span>
                    <p class="font-bold text-sm text-gray-800">Groups</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center" onclick="alert('Events feature coming soon!')">
                    <span class="text-3xl block mb-2">📅</span>
                    <p class="font-bold text-sm text-gray-800">Events</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center" onclick="alert('Business directory coming soon!')">
                    <span class="text-3xl block mb-2">🏪</span>
                    <p class="font-bold text-sm text-gray-800">Local Businesses</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center" onclick="alert('Trusted help coming soon!')">
                    <span class="text-3xl block mb-2">🛠️</span>
                    <p class="font-bold text-sm text-gray-800">Verified Help</p>
                </div>
            </div>
        </div>

        <!-- ================= TAB 3: CREATE POST ================= -->
        <div id="view-post" class="view-section">
            <h2 class="font-extrabold text-lg mb-3">नवीन पोस्ट टाका</h2>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <label class="block text-xs font-bold text-gray-500 mb-1">पोस्टचा प्रकार (Type)</label>
                <select id="postType" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold mb-3 outline-none">
                    <option value="Ask">❓ Ask (काही विचारायचंय)</option>
                    <option value="Sell">🛒 Sell (विकायचंय)</option>
                    <option value="Alert">🚨 Alert (महत्त्वाची सूचना)</option>
                    <option value="Event">📅 Event (कार्यक्रम)</option>
                    <option value="Poll">📊 Poll (मतदान)</option>
                </select>

                <label class="block text-xs font-bold text-gray-500 mb-1">तुमचा मेसेज</label>
                <textarea id="postText" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm mb-3 outline-none" rows="4" placeholder="तुमच्या परिसरात काय चाललंय?"></textarea>
                
                <button onclick="createPost()" class="w-full bg-pink-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">Post करा</button>
            </div>
        </div>

        <!-- ================= TAB 4: ALERTS ================= -->
        <div id="view-alerts" class="view-section">
            <h2 class="font-extrabold text-lg mb-3 text-red-600">🚨 Urgent Alerts</h2>
            <div id="alertsContainer" class="space-y-4">
                <p class="text-center text-gray-500 py-10 text-sm">लोड होत आहे...</p>
            </div>
        </div>

        <!-- ================= TAB 5: PROFILE ================= -->
        <div id="view-profile" class="view-section">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center relative">
                <div class="relative w-24 h-24 mx-auto mb-3">
                    <img id="profileImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-full h-full object-cover rounded-full border-4 border-pink-100 shadow-sm">
                    <label for="profileUpload" class="absolute bottom-0 right-0 bg-pink-600 text-white w-8 h-8 flex items-center justify-center rounded-full cursor-pointer shadow-md text-sm">📷</label>
                    <input type="file" id="profileUpload" class="hidden" accept="image/*" onchange="uploadProfilePhoto(event)">
                </div>
                <h3 id="profName" class="font-extrabold text-xl text-gray-900">लोड होत आहे...</h3>
                <p id="profPhone" class="text-sm text-gray-500 font-medium"></p>
                <div class="mt-2"><span id="profRole" class="badge-role role-resident">Resident</span></div>
                <p id="profAddress" class="text-xs text-gray-400 mt-3 bg-gray-50 p-2 rounded-lg"></p>
                
                <div class="mt-5 grid grid-cols-2 gap-3">
                    <a href="index.html" class="bg-green-50 text-green-700 font-bold py-2.5 rounded-xl text-xs border border-green-200">MH24 Basket वर जा</a>
                    <button onclick="openNeighborDirectory()" class="bg-blue-50 text-blue-700 font-bold py-2.5 rounded-xl text-xs border border-blue-200">Neighbors पहा</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full glass border-t border-gray-200 flex justify-around items-center z-50 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <svg class="w-6 h-6 mx-auto mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Home
        </div>
        <div class="nav-item" onclick="switchTab('discover', this)">
            <svg class="w-6 h-6 mx-auto mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Discover
        </div>
        <div class="nav-item" onclick="switchTab('post', this)">
            <div class="bg-pink-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto -mt-5 shadow-lg border-4 border-white text-2xl font-bold">+</div>
        </div>
        <div class="nav-item" onclick="switchTab('alerts', this)">
            <svg class="w-6 h-6 mx-auto mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            Alerts
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <svg class="w-6 h-6 mx-auto mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Profile
        </div>
    </nav>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script>
        // ================== FIREBASE SETUP ==================
        var firebaseConfig = {
            apiKey: "AIzaSyAlRrFaovXjVso2AK_w04jMFa_YHYSo2AK",
            authDomain: "mh24-basket.firebaseapp.com",
            projectId: "mh24-basket",
            storageBucket: "mh24-basket.firebasestorage.app",
            messagingSenderId: "124229811215",
            appId: "1:124229811215:web:deebbd7886cb9180a6377a"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // ================== GLOBAL STATE ==================
        let currentUser = JSON.parse(localStorage.getItem("mh24_user")) || null;
        let myLat = null, myLng = null;
        let currentFilter = "all";

        // ================== NAVIGATION ==================
        function switchTab(tabId, element) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            if(tabId === 'home') loadFeed();
            if(tabId === 'alerts') loadAlerts();
            if(tabId === 'profile') loadProfile();
        }

        // ================== 1. LOCATION ENGINE (4km Lock) ==================
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        myLat = position.coords.latitude;
                        myLng = position.coords.longitude;
                        document.getElementById("locationAlert").classList.add("hidden");
                        document.getElementById("locationBadge").classList.remove("hidden");
                        loadFeed(); // Load feed after location is found
                        loadProfile(); // Load profile image
                    },
                    (error) => {
                        document.getElementById("locationAlert").innerHTML = "❌ लोकेशन नाकारलं! 4km फीड बघण्यासाठी कृपया लोकेशन Allow करा.";
                        document.getElementById("locationAlert").className = "bg-red-100 text-red-800 p-3 text-center text-xs font-semibold";
                    }
                );
            } else {
                alert("तुमच्या ब्राउझरमध्ये लोकेशन सपोर्ट नाही.");
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            var R = 6371; 
            var dLat = (lat2 - lat1) * (Math.PI/180);
            var dLon = (lon2 - lon1) * (Math.PI/180); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }

        // ================== 2. FEED & POSTS ==================
        async function loadFeed() {
            var container = document.getElementById("postsContainer");
            if(!myLat || !myLng) return;
            
            container.innerHTML = "<p class='text-center text-gray-500 py-10 text-sm'>फीड शोधत आहे...</p>";
            
            try {
                var snap = await db.collection("social_posts").orderBy("createdAt", "desc").limit(50).get();
                container.innerHTML = "";
                var foundCount = 0;

                snap.forEach(doc => {
                    var post = doc.data();
                    if(!post.lat || !post.lng) return;

                    var dist = getDistance(myLat, myLng, post.lat, post.lng);
                    
                    // 🔒 4KM LOCK & Filter Logic
                    if (dist <= 4.0 && (currentFilter === 'all' || post.type === currentFilter)) {
                        foundCount++;
                        var timeStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleTimeString('mr-IN', {hour: '2-digit', minute:'2-digit'}) : "";
                        
                        // Icon logic
                        var icon = "📝";
                        var badgeColor = "bg-gray-100 text-gray-700";
                        if(post.type === 'Ask') { icon = "❓"; badgeColor = "bg-blue-100 text-blue-700"; }
                        if(post.type === 'Sell') { icon = "🛒"; badgeColor = "bg-green-100 text-green-700"; }
                        if(post.type === 'Alert') { icon = "🚨"; badgeColor = "bg-red-100 text-red-700"; }
                        if(post.type === 'Event') { icon = "📅"; badgeColor = "bg-purple-100 text-purple-700"; }
                        if(post.type === 'Poll') { icon = "📊"; badgeColor = "bg-amber-100 text-amber-700"; }

                        var html = `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 bg-pink-100 rounded-full flex items-center justify-center text-pink-600 font-bold">👤</div>
                                    <div>
                                        <p class="text-sm font-bold text-gray-800">${post.authorName}</p>
                                        <p class="text-[10px] text-gray-500">📍 ${dist.toFixed(1)} km जवळ • ${timeStr}</p>
                                    </div>
                                </div>
                                <span class="text-[9px] font-extrabold px-2 py-1 rounded-md ${badgeColor}">${icon} ${post.type || 'Post'}</span>
                            </div>
                            <p class="text-sm text-gray-700 mt-2">${post.text}</p>
                        </div>`;
                        container.innerHTML += html;
                    }
                });

                if (foundCount === 0) {
                    container.innerHTML = "<div class='text-center py-10 bg-white rounded-2xl shadow-sm'><p class='text-gray-500 font-semibold text-sm'>या भागात सध्या कोणतीही पोस्ट नाही.</p></div>";
                }
            } catch (e) {
                container.innerHTML = "<p class='text-center text-red-500 py-10 text-sm'>Error: " + e.message + "</p>";
            }
        }

        async function loadAlerts() {
            var container = document.getElementById("alertsContainer");
            if(!myLat || !myLng) return;
            container.innerHTML = "<p class='text-center text-gray-500 py-10 text-sm'>अलर्ट्स शोधत आहे...</p>";
            
            try {
                var snap = await db.collection("social_posts").where("type", "==", "Alert").orderBy("createdAt", "desc").limit(20).get();
                container.innerHTML = "";
                var foundCount = 0;

                snap.forEach(doc => {
                    var post = doc.data();
                    if(!post.lat || !post.lng) return;
                    var dist = getDistance(myLat, myLng, post.lat, post.lng);
                    if (dist <= 4.0) {
                        foundCount++;
                        var timeStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleTimeString('mr-IN') : "";
                        container.innerHTML += `
                        <div class="bg-red-50 p-4 rounded-2xl shadow-sm border border-red-200">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xl">🚨</span>
                                <div>
                                    <p class="text-sm font-bold text-red-900">${post.authorName}</p>
                                    <p class="text-[10px] text-red-600 font-bold">📍 ${dist.toFixed(1)} km • ${timeStr}</p>
                                </div>
                            </div>
                            <p class="text-sm text-red-800 font-medium mt-2">${post.text}</p>
                        </div>`;
                    }
                });
                if (foundCount === 0) container.innerHTML = "<p class='text-center text-gray-500 py-10 text-sm'>कोणतेही अलर्ट्स नाहीत.</p>";
            } catch(e) {
                // Fallback if index is missing
                container.innerHTML = "<p class='text-center text-red-500 text-sm py-10'>Alerts लोड करता आले नाहीत. (Index Missing)</p>";
            }
        }

        async function createPost() {
            if (!myLat || !myLng) return alert("कृपया लोकेशन Allow करा!");
            if (!currentUser) return alert("कृपया आधी MH24 Basket मध्ये जाऊन Profile सेव्ह करा!");
            
            var text = document.getElementById("postText").value.trim();
            var type = document.getElementById("postType").value;
            if (!text) return alert("काहीतरी लिहा!");

            try {
                await db.collection("social_posts").add({
                    text: text,
                    type: type, // Ask, Sell, Alert, Event, Poll
                    authorName: currentUser.name,
                    authorPhone: currentUser.phone,
                    society: currentUser.society || "Local",
                    lat: myLat,
                    lng: myLng,
                    createdAt: new Date()
                });
                document.getElementById("postText").value = "";
                alert("✅ पोस्ट झाली!");
                switchTab('home', document.querySelectorAll('.nav-item')[0]);
            } catch(e) { alert("Error: " + e.message); }
        }

        function filterFeed(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border";
            });
            event.target.className = "filter-btn bg-pink-600 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap";
            loadFeed();
        }

        // ================== 3. PROFILE & ROLE ==================
        async function loadProfile() {
            if (!currentUser || !currentUser.phone) {
                document.getElementById("profName").textContent = "Profile Save नाही";
                return;
            }
            document.getElementById("profName").textContent = currentUser.name;
            document.getElementById("profPhone").textContent = "+91 " + currentUser.phone;
            document.getElementById("profAddress").textContent = (currentUser.society ? currentUser.society + ", " : "") + (currentUser.address || "");

            try {
                var doc = await db.collection("customers").doc(currentUser.phone).get();
                if (doc.exists) {
                    var d = doc.data();
                    if (d.profilePhoto) {
                        document.getElementById("profileImg").src = d.profilePhoto;
                    }
                    // Role Logic (Default is Resident)
                    var role = d.role || "resident";
                    var roleEl = document.getElementById("profRole");
                    roleEl.textContent = role.toUpperCase();
                    if(role === 'business') roleEl.className = "badge-role role-business";
                    else if(role === 'admin') roleEl.className = "badge-role role-admin";
                    else roleEl.className = "badge-role role-resident";
                }
            } catch(e) { console.error("Error loading profile data", e); }
        }

        function uploadProfilePhoto(event) {
            var file = event.target.files[0];
            if (!file) return;
            if (file.size > 500000) return alert("फोटो 500KB पेक्षा लहान असावा!"); // Simple validation

            var reader = new FileReader();
            reader.onload = async function(e) {
                var base64Image = e.target.result;
                document.getElementById("profileImg").src = base64Image; // Preview
                
                if (currentUser && currentUser.phone) {
                    try {
                        await db.collection("customers").doc(currentUser.phone).update({
                            profilePhoto: base64Image
                        });
                        alert("✅ प्रोफाइल फोटो सेव्ह झाला!");
                    } catch(err) {
                        alert("फोटो सेव्ह करताना एरर आली: " + err.message);
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        // ================== STARTUP ==================
        window.onload = () => {
            getUserLocation();
        };
    </script>
</body>
</html>
